spring.application.name=laptop-store
spring.profiles.default=mysql
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
app.seed=${APP_SEED:false}
app.admin-email=${ADMIN_EMAIL:admin@laptop.local}
app.admin-password=${ADMIN_PASSWORD:}
app.upload-dir=${UPLOAD_DIR:./uploads}
app.base-url=${APP_BASE_URL:http://localhost:8080}
payment.vnpay.code=${VNPAY_TMN_CODE:}
payment.vnpay.secret=${VNPAY_HASH_SECRET:}
payment.momo.partner=${MOMO_PARTNER_CODE:}
payment.momo.access=${MOMO_ACCESS_KEY:}
payment.momo.secret=${MOMO_SECRET_KEY:}
