<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Hồ sơ')}">
</head>
<body>
<nav th:replace="~{fragments :: nav}">
</nav>
<main class="container py-4">
<div th:if="${message}" class="alert alert-info" th:text="${message}">
</div>
<section class="auth panel mx-auto">
<h1 class="h2 mb-4">Thông tin cá nhân</h1>
<form th:action="@{/profile}" th:object="${form}" method="post">
<div th:replace="~{fragments :: errors}">
</div>
<label class="form-label" for="fullName">Họ tên</label>
<input class="form-control mb-3" th:field="*{fullName}" maxlength="100" required>
<label class="form-label" for="phone">Điện thoại</label>
<input class="form-control mb-3" th:field="*{phone}" maxlength="20" >
<label class="form-label" for="address">Địa chỉ</label>
<input class="form-control mb-3" th:field="*{address}" maxlength="300" >
<button class="btn btn-primary">Lưu hồ sơ</button>
</form>
</section>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body></html>
