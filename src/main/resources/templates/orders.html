<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Lịch sử đơn hàng')}">
</head>
<body>
<nav th:replace="~{fragments :: nav}">
</nav>
<main class="container py-4">
<div th:if="${message}" class="alert alert-info" th:text="${message}">
</div>
<h1 class="h2 mb-4">Lịch sử đơn hàng</h1>
<div th:if="${orders.empty}" class="panel text-center py-5">
  <p class="fs-4 mb-2">Bạn chưa có đơn hàng nào</p>
  <p class="text-secondary mb-4">Mọi đơn hàng sau khi đặt sẽ được lưu và hiển thị chi tiết tại đây.</p>
  <a class="btn btn-primary" th:href="@{/}">Xem các dòng laptop →</a>
</div>
<div class="table-responsive" th:unless="${orders.empty}">
<table class="table align-middle">
<thead>
<tr><th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Đơn hàng</th><th>Thanh toán</th><th></th>
</tr>
</thead>
<tbody>
<tr th:each="o:${orders}"><td th:text="'#'+${o.id}"></td><td th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${#numbers.formatInteger(o.total,1,'POINT')}+' ₫'"></td><td><span th:replace="~{fragments :: orderStatusBadge(${o.status})}"></span></td><td><span th:replace="~{fragments :: paymentBadge(${o.paymentMethod}, ${o.paymentStatus})}"></span></td><td><a class="btn btn-sm btn-outline-dark" th:href="@{/orders/{id}(id=${o.id})}">Chi tiết</a></td>
</tr>
</tbody>
</table>
</div>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body></html>
