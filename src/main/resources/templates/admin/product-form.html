<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Biên tập sản phẩm')}">
</head>
<body>
<nav th:replace="~{fragments :: nav}">
</nav>
<main class="container py-4">
<div th:if="${message}" class="alert alert-info" th:text="${message}">
</div>
<div th:replace="~{fragments :: adminnav}">
</div>
<h1 class="h2 mb-4">Thông tin laptop</h1>
<form th:action="@{/admin/products}" th:object="${form}" method="post" enctype="multipart/form-data" class="panel">
<div th:replace="~{fragments :: errors}">
</div>
<input type="hidden" th:field="*{id}">
<input type="hidden" th:field="*{version}">
<div class="row g-3">
<div class="col-md-6">
<label class="form-label" for="name">Tên laptop</label>
<input class="form-control" th:field="*{name}" type="text" required maxlength="160">
</div>
<div class="col-md-6">
<label class="form-label" for="brand">Hãng</label>
<input class="form-control" th:field="*{brand}" type="text" required maxlength="60">
</div>
<div class="col-md-6">
<label class="form-label" for="cpu">CPU</label>
<input class="form-control" th:field="*{cpu}" type="text" required maxlength="255">
</div>
<div class="col-md-6">
<label class="form-label" for="ram">RAM</label>
<input class="form-control" th:field="*{ram}" type="text" required maxlength="255">
</div>
<div class="col-md-6">
<label class="form-label" for="storage">Ổ cứng</label>
<input class="form-control" th:field="*{storage}" type="text" required maxlength="255">
</div>
<div class="col-md-6">
<label class="form-label" for="gpu">Card đồ họa</label>
<input class="form-control" th:field="*{gpu}" type="text" required maxlength="255">
</div>
<div class="col-md-6">
<label class="form-label" for="screen">Màn hình</label>
<input class="form-control" th:field="*{screen}" type="text" required maxlength="255">
</div>
<div class="col-md-6">
<label class="form-label" for="price">Giá bán (₫)</label>
<input class="form-control" th:field="*{price}" type="number" required min="1000" max="1000000000">
</div>
<div class="col-md-6">
<label class="form-label" for="stock">Tồn kho có thể bán</label>
<input class="form-control" th:field="*{stock}" type="number" required min="0" max="1000000">
</div>
<div class="col-md-6">
<label class="form-label" for="categoryId">Danh mục</label>
<select class="form-select" th:field="*{categoryId}" required>
<option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}">
</option>
</select>
</div>
<div class="col-md-6">
<label class="form-label" for="purpose">Nhu cầu</label>
<select class="form-select" th:field="*{purpose}">
<option value="OFFICE">Văn phòng</option>
<option value="GAMING">Gaming</option>
<option value="GRAPHICS">Đồ họa</option>
</select>
</div>
<div class="col-md-6">
<label class="form-label" for="image">Ảnh JPEG/PNG, tối đa 2 MB</label>
<input id="image" type="file" name="image" accept="image/png,image/jpeg" class="form-control">
</div>
<div class="col-12">
<label class="form-label" for="description">Mô tả</label>
<textarea class="form-control" th:field="*{description}" maxlength="3000">
</textarea>
</div>
<div class="col-12">
<label>
<input type="checkbox" th:field="*{active}"> Hiển thị và cho phép mua</label>
</div>
</div>
<button class="btn btn-primary mt-4">Lưu sản phẩm</button>
</form>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body></html>
